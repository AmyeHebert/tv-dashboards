<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMI TV Rotation</title>
<!--
  ARMI TV ROTATOR  (lives in the ROOT of the tv-dashboards repo, next to README.md)

  Each TV opens its own link. Easiest: use the short link page in each BU folder,
  for example  .../tv-dashboards/TF/tv.html

  Or build a link by hand:
    rotate.html?pages=PAGE1,PAGE2,PAGE3&secs=60,30,30

  pages  = comma list of pages in this repo (or full https:// links), shown in order, then repeats
  secs   = seconds for each page, same order as pages (one number = same for all)
  reload = minutes between full refreshes so new numbers appear (default 30)

  Pages taller than the screen scroll slowly top to bottom while they are showing.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0B0D12; overflow: hidden; cursor: none; }
  iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; transition: opacity 0.8s ease;
  }
  iframe.on { opacity: 1; }
</style>
</head>
<body>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);

  var raw = (q.get('pages') || 'TF/').split(',');
  var list = [];
  for (var p = 0; p < raw.length; p++) {
    var s = raw[p].replace(/^\s+|\s+$/g, '');
    if (s) list.push(s);
  }

  var secs = (q.get('secs') || '60').split(',');
  function dwell(i) {
    var v = Number(secs[i] !== undefined ? secs[i] : secs[0]);
    return (isNaN(v) || v < 5 ? 60 : v) * 1000;
  }

  var reloadMin = Number(q.get('reload') || 30);
  if (isNaN(reloadMin) || reloadMin < 5) reloadMin = 30;

  // Cache-buster so the TV does not keep showing old numbers
  var stamp = Date.now();
  function bust(url) {
    var hash = '';
    var h = url.indexOf('#');
    if (h !== -1) { hash = url.slice(h); url = url.slice(0, h); }
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 'v=' + stamp + hash;
  }

  var frames = [];
  for (var i = 0; i < list.length; i++) {
    var f = document.createElement('iframe');
    f.src = bust(list[i]);
    f.setAttribute('scrolling', 'no');
    document.body.appendChild(f);
    frames.push(f);
  }

  // Slow scroll for pages taller than the screen
  var scrollTimer = null;
  function stopScroll() { if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; } }
  function startScroll(f, ms) {
    stopScroll();
    var win, doc;
    try { win = f.contentWindow; doc = win.document; } catch (e) { return; } // other website: cannot scroll
    if (!doc || !doc.documentElement) return;
    win.scrollTo(0, 0);
    var extra = doc.documentElement.scrollHeight - win.innerHeight;
    if (extra < 40) return;                       // fits on screen, nothing to do
    var hold = Math.min(5000, ms * 0.15);          // pause at top and at bottom
    var travel = ms - hold * 2;
    if (travel < 2000) return;
    var start = Date.now() + hold;
    scrollTimer = setInterval(function () {
      var t = (Date.now() - start) / travel;
      if (t < 0) return;
      if (t > 1) t = 1;
      win.scrollTo(0, Math.round(extra * t));
    }, 40);
  }

  var cur = 0;
  function show(n) {
    frames[cur].className = '';
    cur = n;
    frames[cur].className = 'on';
    startScroll(frames[cur], dwell(cur));
    setTimeout(function () { show((cur + 1) % frames.length); }, dwell(cur));
  }

  if (frames.length === 1) {
    frames[0].className = 'on';
  } else if (frames.length > 1) {
    // give the first page a moment to load before measuring it
    frames[0].className = 'on';
    frames[0].onload = function () { startScroll(frames[0], dwell(0)); };
    setTimeout(function () { show(1 % frames.length); }, dwell(0));
  }

  setTimeout(function () { window.location.reload(); }, reloadMin * 60 * 1000);
})();
</script>
</body>
</html>
