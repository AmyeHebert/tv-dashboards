name: Refresh TV boards from Pipedrive

# Rebuilds the TF, PEI, PUP and HVAC golf boards from live Pipedrive data.
# TVs keep the same address (e.g. .../TF/tv.html) and reload every 30 minutes on their own.
#
# Schedule: every hour, 5 AM to 6 PM Central, Monday to Friday (cron is in UTC).
# Refresh right now: GitHub > Actions > "Refresh TV boards from Pipedrive" > Run workflow.
# Needs repo secret PIPEDRIVE_API_TOKEN (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: '7 11-23 * * 1-5'
    - cron: '7 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-boards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build boards
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
        run: python scripts/build_boards.py
      - name: Publish if anything changed
        run: |
          git config user.name "tv-boards-bot"
          git config user.email "tv-boards-bot@users.noreply.github.com"
          git add TF PEI PUP HVAC
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh TV boards from Pipedrive ($(TZ=America/Chicago date '+%a %m/%d %I:%M %p'))"
            git push
          fi
